<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Select | Emordes Studio</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#F6F6F6;color:#111;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.top{display:flex;justify-content:space-between;padding:20px 28px;font:400 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:#666}
.top a{color:#111;text-decoration:none}.top a:hover{text-decoration:underline}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:6vh;--bhH:clamp(150px,27vw,340px)}
.enter{display:block;margin:22px auto 0;font:400 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#111;text-decoration:none;border:1px solid #111;border-radius:9999px;padding:10px 20px}
.enter:hover{background:#111;color:#F6F6F6}
.enter:focus-visible{outline:3px solid #111;outline-offset:3px}
</style><link rel="stylesheet" href="bhc.css"></head><body>
<div class="top"><a href="home.html">Emordes Studio</a><span>Select a door</span><a href="catalog.html">Shop</a></div>
<main id="main"><div id="car"></div><a class="enter" id="enter" href="catalog.html">Enter</a></main>
<script src="bhc.js"></script>
<script>
var S=[{title:'Shop',img:'images/hero-01.jpg',href:'catalog.html'},{title:'Laboratory',img:'images/hero-02.jpg',href:'https://izlab.emordes.studio'},{title:'The Maison',soon:true,href:'#maison'},{title:'Gallery',img:'images/hero-03.jpg',href:'https://www.emordes.studio/archive'}];
var en=document.getElementById('enter');
BHC(document.getElementById('car'),S,{onchange:function(i,s){en.textContent=s.soon?'Coming soon':'Enter '+s.title;en.href=s.soon?'#maison':s.href;if(s.soon){en.onclick=function(e){e.preventDefault()}}else en.onclick=null}});
</script></body></html>
