<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Select | Emordes Studio</title>
<link rel="stylesheet" href="bhc.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#F6F6F6;color:#111;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.grid{height:100vh;height:100dvh;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.card{position:relative;display:block;border-radius:36px;overflow:hidden;color:inherit;text-decoration:none;isolation:isolate;transform:translateZ(0);transition:transform .6s cubic-bezier(.22,.8,.2,1),box-shadow .6s}
.card:hover,.card:focus-visible{transform:scale(.985)}
.card:focus-visible{outline:3px solid #1C45FF;outline-offset:3px}
.tag{position:absolute;z-index:6;left:18px;top:16px;font:600 10px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.go{position:absolute;z-index:6;right:16px;bottom:14px;font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;border-radius:9999px;background:rgba(17,17,17,.9);color:#F6F6F6;opacity:.0;transform:translateY(6px);transition:.4s}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
/* 1 shop */
.c1{background:#F0F0F2;--bhH:clamp(70px,19vh,200px);display:flex;flex-direction:column;justify-content:center}
.c1 .tag{color:#666}
.c1 .bhc-meta{color:#666;font-weight:600;font-family:Helvetica,Arial,sans-serif;letter-spacing:.08em}
.c1 .vl{position:absolute;top:18%;bottom:14%;width:1px;background:#b9b9bf;z-index:0}
.c1 .vl.a{left:calc(50% - min(32%,var(--bhH)*1.65) - 8px)}.c1 .vl.b{right:calc(50% - min(32%,var(--bhH)*1.65) - 8px)}
.c1 .bhc{position:relative;z-index:1}
/* 2 lab */
.c2{background:#200D0E;color:#fff}
.c2 .bg{position:absolute;inset:-6%;background:url(images/work-04.jpg) center/cover;filter:grayscale(1) contrast(1.1) blur(3px);opacity:.9;mix-blend-mode:luminosity;animation:drift 18s ease-in-out infinite alternate;z-index:-2}
.c2::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#4A1E20,#200D0E 70%);mix-blend-mode:multiply;z-index:-1}
.c2::after{content:"";position:absolute;inset:0;background:linear-gradient(#200D0E 0,rgba(32,13,14,0) 30%,rgba(32,13,14,0) 70%,#200D0E 100%);z-index:1;pointer-events:none}
@keyframes drift{to{transform:scale(1.12) translate(2%,-2%)}}
.c2 .tag{color:#ffd9d4}
.c2 .cnt{position:absolute;z-index:6;right:16px;top:14px;font:600 11px/1 Helvetica,Arial,sans-serif;padding:7px 11px;border-radius:9999px;background:rgba(0,0,0,.45);color:#fff}
.wl{position:absolute;inset:0;z-index:2;pointer-events:none}
.wl span{position:absolute;left:0;right:0;top:50%;text-align:center;font:200 clamp(18px,3.2vw,50px)/1 Helvetica,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;will-change:transform,opacity}
.wl span i{font:600 9px/1 ui-monospace,Menlo,monospace;vertical-align:top;margin-left:6px;letter-spacing:.1em;opacity:.7}
/* 3 maison */
.c3{background:#EDECEE;perspective:900px}
.c3 .cols{position:absolute;inset:-10% -4%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;transform-style:preserve-3d;transform:rotateX(6deg) scale(1.06)}
.c3 .col{display:flex;flex-direction:column;gap:12px;animation:scrollup var(--t,26s) linear infinite}
.c3 .col:nth-child(2){animation-direction:reverse;--t:32s}
.c3 .col:nth-child(1){transform:rotateY(14deg) translateZ(-30px)}
.c3 .col:nth-child(3){transform:rotateY(-14deg) translateZ(-30px);--t:22s}
.c3 .col:nth-child(2){transform:translateZ(50px) scale(1.06)}
.c3 .col>div{border-radius:30px;background-size:cover;background-position:center;flex:none;aspect-ratio:var(--ar,1/1.1)}
@keyframes scrollup{to{translate:0 -50%}}
.c3::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(237,236,238,0) 45%,rgba(237,236,238,.75) 100%);z-index:2;pointer-events:none}
.c3 .tag{color:#111;background:rgba(246,246,246,.85);padding:7px 10px;border-radius:9999px;left:14px;top:14px}
.c3 .soon{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;padding:12px 18px;border-radius:9999px;background:#111;color:#F6F6F6;white-space:nowrap}
/* 4 gallery */
.c4{background:#F2F2F4}
.c4 .ic{position:absolute;inset:-8% 4%;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,3vw,40px);align-content:center}
.c4 .ic div{aspect-ratio:1;border-radius:22%;background-size:cover;background-position:center;box-shadow:0 8px 22px rgba(0,0,0,.12);animation:fl var(--d,7s) ease-in-out infinite alternate;animation-delay:var(--w,0s)}
@keyframes fl{from{transform:translate(-5px,-9px) rotate(-1.5deg)}to{transform:translate(6px,10px) rotate(1.5deg)}}
.c4 .ttl::before{content:'';position:absolute;left:8%;right:8%;top:-30%;bottom:-30%;background:radial-gradient(ellipse at center,rgba(242,242,244,.96) 0,rgba(242,242,244,.88) 45%,rgba(242,242,244,0) 72%);z-index:-1}
.c4 .ttl{position:absolute;z-index:3;left:0;right:0;top:50%;transform:translateY(-52%);text-align:center;pointer-events:none}
.c4 h2{font:400 clamp(26px,5vw,76px)/.95 "Times New Roman",Times,serif;letter-spacing:-.02em;color:#111;text-transform:none;text-shadow:0 0 18px rgba(246,246,246,.9),0 0 4px rgba(246,246,246,.9)}
.c4 p{font:600 clamp(8px,.9vw,12px)/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;margin-top:10px;color:#111;background:rgba(246,246,246,.85);display:inline-block;padding:5px 9px;border-radius:9999px}
.c4 .tag{color:#111}
@media(max-width:600px){
 .grid{padding:8px;gap:8px}
 .card{border-radius:24px}
 .tag{left:12px;top:12px;font-size:8px}
 .go{opacity:1;transform:none;right:10px;bottom:10px;font-size:8px;padding:6px 8px}
 .c1{--bhH:clamp(44px,11vh,80px)}
 .c1 .bhc-t{font-size:11px;letter-spacing:.14em;margin-top:12px}
 .c1 .bhc-meta{font-size:8px}
 .c2 .cnt{right:10px;top:10px;font-size:9px}
 .c3 .cols{gap:8px}.c3 .col{gap:8px}.c3 .col>div{border-radius:18px}
 .c3 .soon{font-size:8px;padding:8px 10px}
 .c4 .ic{gap:10px;inset:-8% 8%}
}
@media(prefers-reduced-motion:reduce){.card,.c2 .bg,.c3 .col,.c4 .ic div{animation:none;transition:none}}
</style></head><body>
<main class="grid" id="main">
 <a class="card c1" href="catalog.html" aria-label="Shop"><span class="tag">001 Shop</span><i class="vl a"></i><i class="vl b"></i><div id="car"></div><span class="go">Enter shop &rarr;</span></a>
 <a class="card c2" href="https://izlab.emordes.studio" aria-label="Laboratory"><div class="bg"></div><span class="tag">002 Laboratory</span><span class="cnt" id="cnt">1/6</span><div class="wl" id="wl"></div><span class="go">Enter laboratory &rarr;</span></a>
 <a class="card c3" href="#maison" id="maison" aria-label="The Maison, coming soon"><div class="cols" id="cols"></div><span class="tag">003 The Maison</span><span class="soon">Coming soon</span></a>
 <a class="card c4" href="https://www.emordes.studio/archive" aria-label="Gallery"><span class="tag">004 Gallery</span><div class="ic" id="ic"></div><div class="ttl"><h2>The Gallery</h2><p>Emordes archive 01</p></div><span class="go">Enter gallery &rarr;</span></a>
</main>
<script src="bhc.js"></script>
<script>
var IM=['work-01','work-02','work-03','work-04','work-05','work-06','work-07','work-08','hero-01','hero-02','hero-03'];
function im(n){return "url(images/"+IM[n%IM.length]+".jpg)"}
// 1 shop carousel (pill + discs)
BHC(document.getElementById('car'),['Singularity','Gargantua','Event Horizon','Accretion Disk','Spacetime'].map(function(t,k){return{title:t,img:'images/'+IM[(k*2)%8]+'.jpg'}}),{prefix:'DAY',keys:false,fmt:function(p,x){return 'DAY '+x}});
// 2 lab word wheel
var W=['Control','Elegance','Sophistication','Innovation','Balance','Excellence'],wl=document.getElementById('wl'),cnt=document.getElementById('cnt'),ws=[];
W.forEach(function(w,k){var s=document.createElement('span');s.innerHTML=w+'<i>0'+(k+1)+'</i>';wl.appendChild(s);ws.push(s)});
var pos=2,tgt=2,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function wheel(){var n=W.length;ws.forEach(function(s,k){var d=k-pos;d=((d+n/2)%n+n)%n-n/2;var a=Math.abs(d),h=wl.clientHeight;
 s.style.transform='translateY('+(d*h*.15-50)+'%) translateY(0) scale('+(1-Math.min(a,3)*.12)+')';s.style.transform='translateY(calc(-50% + '+(d*wl.clientHeight*.16)+'px)) scale('+(1-Math.min(a,3)*.1)+')';
 s.style.opacity=Math.max(.12,1-a*.3);s.style.filter='blur('+Math.max(0,(a-.6)*1.6)+'px)';s.style.fontWeight=a<.5?300:200});
 pos+=(tgt-pos)*.08;if(!reduce)requestAnimationFrame(wheel)}
wheel();
if(!reduce)setInterval(function(){if(document.hidden)return;tgt+=1;cnt.textContent=(((tgt%6)+6)%6+1)+'/6'},1600);
cnt.textContent='3/6';
// 3 maison grid
var cols=document.getElementById('cols'),ar=['1/1.25','1/1','1/1.4','1/.9','1/1.2','1/1.1'];
for(var c=0;c<3;c++){var col=document.createElement('div');col.className='col';var h='';for(var r=0;r<2;r++)for(var k=0;k<5;k++){h+='<div style="background-image:'+im(c*3+k*2+1)+';--ar:'+ar[(c+k)%6]+'"></div>'}col.innerHTML=h;cols.appendChild(col)}
document.getElementById('maison').addEventListener('click',function(e){e.preventDefault()});
// 4 gallery icons
var ic=document.getElementById('ic'),hh='';for(var k=0;k<12;k++)hh+='<div style="background-image:'+im(k*3+2)+';--d:'+(5+(k%4))+'s;--w:-'+(k*.7)+'s"></div>';ic.innerHTML=hh;
</script></body></html>
